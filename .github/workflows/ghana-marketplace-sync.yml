name: Sync Ghana marketplace listings

on:
  schedule:
    - cron: "37 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ghana-marketplace-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh current Ghana inventory
        run: >-
          python ghana_marketplace_sync.py
          --limit-per-source 25
          --max-published 50
          --min-total 8
          --localize-vehicles 10
      - name: Verify Ghana inventory
        run: python -m unittest tests/test_ghana_marketplace_sync.py
      - name: Commit listing updates
        shell: bash
        run: |
          if git diff --quiet -- data/scraped-listings.csv data/oxglow-vehicles-images; then
            echo "No Ghana marketplace changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scraped-listings.csv data/oxglow-vehicles-images
          git commit -m "Sync Ghana marketplace listings"
          git push
