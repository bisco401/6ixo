name: Sync Guyana marketplace listings

on:
  schedule:
    - cron: "17 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: guyana-marketplace-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4
      - name: Import current electronics and property listings
        run: >-
          python guyana_marketplace_scrape.py
          --status published
          --max-electronics 12
          --max-properties 20
          --refresh-existing
          --prune-missing
      - name: Commit listing updates
        shell: bash
        run: |
          if git diff --quiet -- data/scraped-listings.csv; then
            echo "No Guyana marketplace changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scraped-listings.csv
          git commit -m "Sync Guyana electronics and property listings"
          git push
