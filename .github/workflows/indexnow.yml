name: Notify search engines

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "**/index.html"
      - "robots.txt"
      - "sitemap.xml"
      - "indexnow.config.json"
      - "36b364947eb07ab295ea6b6472d9ad01.txt"
      - "scripts/seo-audit.mjs"
      - "scripts/submit-indexnow.mjs"
      - "scripts/lib/published-site.mjs"
      - "scripts/wait-for-pages.mjs"
      - ".github/workflows/indexnow.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: indexnow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notify-indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate search-engine configuration
        run: |
          node scripts/seo-audit.mjs
          node scripts/submit-indexnow.mjs --dry-run
      - name: Wait for the current GitHub Pages deployment
        env:
          SIXO_VERIFY_GITHUB_PAGES_ORIGIN: '1'
        run: node scripts/wait-for-pages.mjs
      - name: Notify IndexNow participants
        env:
          SIXO_VERIFY_GITHUB_PAGES_ORIGIN: '1'
        run: node scripts/submit-indexnow.mjs
