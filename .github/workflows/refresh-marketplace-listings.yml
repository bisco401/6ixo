name: Refresh marketplace listings and availability

on:
  schedule:
    # Search five times a day, with no scheduled gap longer than five hours.
    - cron: "17 1,11,16,21 * * *"
    # This run also checks availability across the existing feeds.
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: listing-data-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      CRAWL4AI_URL: ${{ vars.CRAWL4AI_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install public listing parsers
        run: python -m pip install beautifulsoup4 requests
      - name: Verify source classification and publication guards
        run: |
          python -m unittest discover -s tests -p test_listing_availability.py
          python -m unittest discover -s tests -p test_marketplace_refresh.py
          python -m unittest discover -s tests -p test_regional_listing_refresh.py
          python -m unittest discover -s tests -p test_listing_discovery_cadence.py
          python -m unittest discover -s tests -p test_kenya_public_refresh.py
          python -m unittest discover -s tests -p test_china_supplier_refresh.py
          python -m unittest discover -s tests -p test_preserve_existing_listings.py
          python -m unittest discover -s tests -p test_expansion_refresh.py
          python -m unittest discover -s tests -p test_category_refresh.py
          python -m unittest discover -s tests -p test_guyana_marketplace_refresh.py
          python -m unittest discover -s tests -p test_ghana_marketplace_sync.py
          node --test tests/ghana_source_verification.test.cjs
          node scripts/regional-listing-location.test.cjs
          node scripts/listing-integrity.test.cjs
      - name: Preserve existing listings before discovery
        id: discovery
        run: |
          date -u +started_at=%Y-%m-%dT%H:%M:%SZ >> "$GITHUB_OUTPUT"
          python scripts/preserve-existing-listings.py capture
      - name: Import New York, Florida, Atlanta, Texas and Ethiopia sources
        id: regional
        continue-on-error: true
        run: >-
          python scripts/refresh-regional-listings.py
          --new-only --limit-per-source 12 --candidate-limit 36 --workers 3
      - name: Import current Canada, US, Jamaica and Kenya ads
        id: general
        continue-on-error: true
        run: >-
          python scripts/refresh-marketplace-listings.py
          --new-only --limit-per-region-category 6 --candidate-limit 24 --workers 8
          --crawl4ai-url "$CRAWL4AI_URL"
      - name: Refresh Ghana vehicles, parts, property and electronics
        id: ghana
        continue-on-error: true
        run: |
          python ghana_marketplace_sync.py --new-only --limit-per-source 60 --max-published 0 --min-total 8
      - name: Search Kenya public dealer inventory
        id: kenya
        continue-on-error: true
        run: python scripts/refresh-kenya-public-listings.py --new-only
      - name: Search China suppliers and refresh their exact product inventory
        id: china
        continue-on-error: true
        run: python scripts/refresh-china-supplier-listings.py --new-only
      - name: Add new Lagos, Johannesburg, London and Kampala dealer listings
        id: expansion
        continue-on-error: true
        run: python scripts/refresh-expansion-listings.py
      - name: Add new electronics and appliances, including Kampala
        id: products
        continue-on-error: true
        run: python scripts/refresh-category-listings.py --kind product --report output/product-listing-refresh-report.json
      - name: Add available homes and apartments in Kampala
        id: uganda_property
        continue-on-error: true
        run: python scripts/refresh-category-listings.py --kind property --report output/uganda-property-refresh-report.json
      - name: Add current vacancies with verified recruiter contacts and closing dates
        id: jobs
        continue-on-error: true
        run: python scripts/refresh-category-listings.py --kind job --report output/job-listing-refresh-report.json
      - name: Refresh Guyana property and electronics
        id: guyana
        continue-on-error: true
        run: >-
          python guyana_marketplace_scrape.py --csv data/guyana-listings.csv
          --max-electronics 30 --max-properties 36 --status published
      - name: Refresh Dubai dealer vehicles
        id: dubai_vehicles
        continue-on-error: true
        run: python dubai_phone_listings_scrape.py --limit 40 --audit-dir output/dubai-vehicles
      - name: Refresh Dubai electronics and property
        id: dubai_marketplace
        continue-on-error: true
        run: python dubai_marketplace_scrape.py --limit 20 --audit-dir output/dubai-marketplace
      - name: Enforce real source images, complete phones and category routing
        run: >-
          node scripts/repair-listing-feeds.mjs
          data/scraped-listings.csv data/jamaica-listings.csv data/dubai-listings.csv
          data/guyana-listings.csv data/kenya-listings.csv data/kijiji-gta-recent-with-phones.csv
          data/oxglow-auto-parts-accessories-recent.csv data/oxglow-electronics-recent.csv
          data/oxglow-real-estate-recent.csv
      - name: Keep discovery additions and preserve every existing record
        run: python scripts/preserve-existing-listings.py enforce
      - name: Check all imported feeds and update shared availability
        if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 6 * * *'
        run: python scripts/check-listing-availability.py --workers 24 --prune-confirmed --crawl4ai-url "$CRAWL4AI_URL"
      - name: Verify public feeds
        run: node scripts/listing-publication.test.cjs
      - name: Cache Nigeria dealer photos that block cross-site embedding
        run: python scripts/cache-nigeria-listing-images.py
      - name: Record successful searches and report source failures
        env:
          DISCOVERY_STARTED_AT: ${{ steps.discovery.outputs.started_at }}
          DISCOVERY_OUTCOMES: ${{ toJSON(steps) }}
        run: python scripts/listing-discovery-cadence.py record
      - name: Publish verified feed updates
        run: |
          if git diff --quiet -- data; then
            echo "No listing changes to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*listings.csv data/kijiji-gta-recent-with-phones.csv data/oxglow-*-recent.csv data/listing-availability.json data/listing-integrity-repairs.json data/listing-discovery-state.json data/listing-image-cache.json data/listing-image-cache/
          git commit -m "Refresh marketplace listings and confirmed availability"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Save source refresh reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marketplace-source-reports
          path: output/*report.json
          retention-days: 14
