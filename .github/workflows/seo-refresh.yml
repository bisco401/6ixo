name: Refresh searchable marketplace pages

on:
  push:
    branches: [main]
    paths:
      - 'data/*listings.csv'
      - 'data/listing-availability.json'
      - 'data/listing-integrity-repairs.json'
      - 'scripts/*seo*.mjs'
      - 'scripts/generate-sitemap.mjs'
      - 'scripts/lib/seo.mjs'
      - 'robots.txt'
      - '.github/workflows/seo-refresh.yml'
  workflow_run:
    workflows:
      - Refresh marketplace listings and availability
      - Sync Ghana marketplace listings
      - Sync Guyana marketplace listings
      - Sync recent Kenya listings
      - Sync recent Kijiji listings
      - Verify imported listing images and categories
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: listing-data-publish
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild current public inventory and validate SEO
        run: |
          npm run seo:refresh
          npm run test:seo
      - name: Save refreshed pages
        run: |
          git add -u
          git add listing listings data/generated-listing-pages.json data/seo-page-state.json
          if git diff --cached --quiet; then
            echo 'No searchable page changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh crawlable marketplace inventory and sitemap'
          git pull --rebase origin main
          git push origin HEAD:main
      # Commits made with GITHUB_TOKEN do not automatically start a Pages build.
      - name: Request publication through the existing GitHub Pages setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
      - name: Wait for the updated sitemap and notify participating search engines
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs/promises';
          import crypto from 'node:crypto';
          const expected = crypto.createHash('sha256').update(await fs.readFile('sitemap.xml')).digest('hex');
          for (let attempt = 0; attempt < 40; attempt++) {
            const response = await fetch(`https://6ixo.com/sitemap.xml?seo=${Date.now()}`, { signal: AbortSignal.timeout(20000) });
            if (response.ok && crypto.createHash('sha256').update(await response.text()).digest('hex') === expected) process.exit(0);
            await new Promise(resolve => setTimeout(resolve, 15000));
          }
          throw new Error('The new sitemap did not become public within ten minutes.');
          JS
          node scripts/submit-indexnow.mjs
