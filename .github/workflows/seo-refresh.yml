name: Refresh searchable marketplace pages

on:
  push:
    branches: [main]
    paths:
      - 'data/*listings.csv'
      - 'data/listing-availability.json'
      - 'data/listing-integrity-repairs.json'
      - 'scripts/*seo*.mjs'
      - 'scripts/generate-sitemap.mjs'
      - 'scripts/lib/seo.mjs'
      - 'scripts/equip-category-chapters.mjs'
      - 'scripts/lib/category-chapters.mjs'
      - 'assets/category-chapters.*'
      - 'assets/seo-navigation.css'
      - 'scripts/lib/marketplace-search.mjs'
      - 'scripts/lib/published-site.mjs'
      - 'scripts/wait-for-pages.mjs'
      - 'robots.txt'
      - '.github/workflows/seo-refresh.yml'
  workflow_run:
    workflows:
      - Refresh marketplace listings and availability
      - Sync Ghana marketplace listings
      - Sync Guyana marketplace listings
      - Sync recent Kenya listings
      - Sync recent Kijiji listings
      - Verify imported listing images and categories
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: listing-data-publish
  cancel-in-progress: false

jobs:
  refresh:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SIXO_VERIFY_GITHUB_PAGES_ORIGIN: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild current public inventory and validate SEO
        run: |
          npm run seo:refresh
          npm run test:seo
      - name: Save refreshed pages
        run: |
          git add -u
          git add listing listings apartments-for-rent phones-for-sale cars-for-sale events data/generated-listing-pages.json data/seo-page-state.json
          if git diff --cached --quiet; then
            echo 'No searchable page changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh crawlable marketplace inventory and sitemap'
          git pull --rebase origin main
          git push origin HEAD:main
      # Commits made with GITHUB_TOKEN do not automatically start a Pages build.
      - name: Request publication through the existing GitHub Pages setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
      - name: Wait for the updated sitemap and notify participating search engines
        run: |
          node scripts/wait-for-pages.mjs
          node scripts/submit-indexnow.mjs
