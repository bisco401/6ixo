name: Sync recent Kenya listings

on:
  # Automatic discovery is owned by refresh-marketplace-listings.yml.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: listing-data-publish
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install source parsers
        run: python -m pip install beautifulsoup4 requests
      - name: Verify public Kenya source parsers
        run: python -m unittest discover -s tests -p test_kenya_public_refresh.py
      - name: Search current publicly contactable Kenya inventory
        id: kenya
        continue-on-error: true
        run: python scripts/refresh-kenya-public-listings.py
      - name: Check Kenya source deletions across both feeds
        run: python scripts/check-listing-availability.py --countries Kenya --workers 8
      - name: Apply publication and identity checks
        run: |
          node scripts/repair-listing-feeds.mjs data/scraped-listings.csv data/kenya-listings.csv
          node scripts/listing-publication.test.cjs
      - name: Commit verified listings and removals
        run: |
          if git diff --quiet -- data; then
            echo "No Kenya changes to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/scraped-listings.csv data/kenya-listings.csv data/listing-availability.json
          git commit -m "Sync verified Kenya listings and availability"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Save source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kenya-source-reports
          path: output/*report.json
          retention-days: 14
      - name: Report incomplete discovery
        if: steps.kenya.outcome == 'failure'
        run: |
          echo "Some Kenya sources could not be verified. See the source report."
          exit 1
