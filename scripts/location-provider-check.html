<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex,nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Location provider check</title>
</head>
<body>
  <h1>Location provider check</h1>
  <p>Uses three fixed public landmark coordinates. Does not request device location.</p>
  <button id="run" disabled>Check provider</button>
  <pre id="result" role="status">Loading provider…</pre>
  <script src="/google-config.js"></script>
  <script>
    const result = document.getElementById('result');
    const button = document.getElementById('run');
    window.runProviderCheck = async () => {
      const { Geocoder } = await google.maps.importLibrary('geocoding');
      const geocoder = new Geocoder();
      result.textContent = 'Provider loaded. Ready to check.';
      button.disabled = false;
      button.onclick = async () => {
        button.disabled = true;
        result.textContent = 'Checking…';
        const locations = [
          { name: 'Toronto City Hall', lat: 43.6534, lng: -79.3841 },
          { name: 'Eiffel Tower', lat: 48.85837, lng: 2.294481 },
          { name: 'Nairobi City Hall', lat: -1.2865, lng: 36.8218 }
        ];
        const checks = await Promise.all(locations.map(({ name, lat, lng }) => new Promise(resolve => {
          const timeout = setTimeout(() => resolve({ name, status: 'TIMEOUT' }), 15000);
          geocoder.geocode({ location: { lat, lng } }, (results, status) => {
            clearTimeout(timeout);
            const components = (results || []).flatMap(r => r.address_components || []);
            const pick = type => components.find(c => c.types.includes(type))?.long_name || '';
            resolve({ name, status, city: pick('locality') || pick('postal_town'), country: pick('country') });
          });
        })));
        result.textContent = JSON.stringify(checks, null, 2);
      };
    };
    const script = document.createElement('script');
    script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(window.GOOGLE_MAPS_API_KEY)}&loading=async&callback=runProviderCheck&v=weekly`;
    script.onerror = () => { result.textContent = 'Provider script failed to load.'; };
    document.head.appendChild(script);
  </script>
</body>
</html>
